task: espnet3.systems.asr.task.ASRTask

dataset:
  train:
    - data_src_args:
        split: train-clean-100
        cache: ${cache}
    - data_src_args:
        split: train-clean-360
        cache: ${cache}
    - data_src_args:
        split: train-other-500
        cache: ${cache}
  valid:
    - data_src_args:
        split: dev-clean
        cache: ${cache}
    - data_src_args:
        split: dev-other
        cache: ${cache}
  preprocessor:
    _target_: espnet2.train.preprocessor.CommonPreprocessor
    train: true
    token_type: bpe
    token_list: ${tokenizer.save_path}/tokens.txt
    bpemodel: ${tokenizer.save_path}/bpe.model
    fs: 16000
    data_aug_prob: 0.667
    data_aug_effects:
      - - [0.5, speed_perturb, {factor: 0.9}]
        - [0.5, speed_perturb, {factor: 1.1}]

create_dataset:
  recipe_dir: ${recipe_dir}
  cache: ${cache}

cache:
  enabled: false
  backend: omniio
  cache_dir: ${data_dir}/omniio

tokenizer:
  vocab_size: 5000
  character_coverage: 1.0
  model_type: bpe
  save_path: ${data_dir}/${tokenizer.model_type}_${tokenizer.vocab_size}
  text_builder:
    func: src.tokenizer.gather_training_text
    recipe_dir: ${recipe_dir}

model:
  vocab_size: ${tokenizer.vocab_size}
  token_list: ${tokenizer.save_path}/tokens.txt
  encoder: e_branchformer
  encoder_conf:
    output_size: 512
    attention_heads: 8
    attention_layer_type: rel_selfattn
    pos_enc_layer_type: rel_pos
    rel_pos_type: latest
    cgmlp_linear_units: 3072
    cgmlp_conv_kernel: 31
    use_linear_after_conv: false
    gate_activation: identity
    num_blocks: 17
    dropout_rate: 0.1
    positional_dropout_rate: 0.1
    attention_dropout_rate: 0.1
    input_layer: conv2d
    layer_drop_rate: 0.1
    linear_units: 1024
    positionwise_layer_type: linear
    use_ffn: true
    macaron_ffn: true
    merge_conv_kernel: 31
  decoder: transformer
  decoder_conf:
    attention_heads: 8
    linear_units: 2048
    num_blocks: 6
    dropout_rate: 0.1
    positional_dropout_rate: 0.1
    self_attention_dropout_rate: 0.1
    src_attention_dropout_rate: 0.1
    layer_drop_rate: 0.2
  normalize: global_mvn
  normalize_conf:
    stats_file: ${stats_dir}/train/feats_stats.npz
  model_conf:
    ctc_weight: 0.3
    lsm_weight: 0.1
    length_normalized_loss: false
  frontend: default
  frontend_conf:
    n_fft: 512
    win_length: 400
    hop_length: 160
  specaug: specaug
  specaug_conf:
    apply_time_warp: true
    time_warp_window: 5
    time_warp_mode: bicubic
    apply_freq_mask: true
    freq_mask_width_range: [0, 27]
    num_freq_mask: 2
    apply_time_mask: true
    time_mask_width_ratio_range: [0.0, 0.05]
    num_time_mask: 10

optimizer:
  _target_: torch.optim.Adam
  lr: 0.002
  weight_decay: 0.000001

scheduler:
  _target_: espnet2.schedulers.warmup_lr.WarmupLR
  warmup_steps: 40000

best_model_criterion:
  - [valid/acc, 10, max]

dataloader:
  train:
    iter_factory:
      num_workers: 8
      batches:
        type: numel
        shape_files: ["${stats_dir}/train/feats_shape"]
        batch_size: 16
        batch_bins: 140000000

trainer:
  accumulate_grad_batches: 1
  check_val_every_n_epoch: 1
  gradient_clip_val: 5.0
  log_every_n_steps: 100
  max_epochs: 80
  precision: bf16-mixed
