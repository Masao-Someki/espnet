autoresearch:
  study_name: ls100_no_early_stop
  study_dir: exp/autoresearch/ls100_no_early_stop
  graph:
  application: hyperparameter_search
  objective_file: program.md

  task: ASR
  dataset: LibriSpeech 100h
  model: e_branchformer
  year: 2026

  recipe:
    training_config: conf/tuning/training_e_branchformer.yaml
    inference_config: conf/inference.yaml
    metrics_config: conf/metrics.yaml

  metric:
    name: dev_clean_wer
    mode: min
    extraction:
      - path: "inference/metrics.json"
        name: dev_clean_wer
        key: "espnet3.systems.esp2_asr.metrics.wer.WER.dev-clean.WER"
      - path: "exp/score_wer/result.txt"
        name: dev_clean_wer
        pattern: "WER: {value}"

  budget:
    max_trials: 200
    max_parallel_trials: 4
    max_failures: 10
    no_improve_stop: 10
    max_wallclock_hours: 24

  tick_interval_sec_idle: 60
  tick_interval_sec_trial_active: 600

  submission:
    environment: slurm
    instructions: |
      Submit jobs with Slurm: write the script to the supplied script_path, map
      resource limits to #SBATCH options, and submit it with sbatch. Use squeue
      and sacct for job status and scancel to cancel jobs. Run the supplied worker
      command from the recipe directory with the repository's pixi environment.
      Return the Slurm job ID.
    resources:
      gpus: 1
      cpus: 16
      mem: 32G
      time: "12:00:00"
      partition: gpuA100x4
      account: bbjs-delta-gpu
      reservation: sup-27103
      nodelist: gpua018
    controller:
      resources:
        gpus: 0
        cpus: 1
        mem: 4G
        time: "06:00:00"
        partition: cpu
        account: bbjs-delta-cpu
      handoff_after_sec: 18000
  agent:
    provider: codex
    # To use a local Codex-compatible endpoint, set Codex CLI overrides here:
    # codex:
    #   model: shogun-worker
    #   config:
    #     model_provider: vllm
    #     model_providers.vllm.name: vLLM
    #     model_providers.vllm.base_url: http://127.0.0.1:32425/v1
    #     model_providers.vllm.env_key: OPENAI_API_KEY
    #     model_providers.vllm.wire_api: responses
    #     model_providers.vllm.supports_standalone_web_search: true
    #     model_context_window: 131072
    #     model_auto_compact_token_limit: 110000
    #     disable_response_storage: true
    #     web_search: live
    #     developer_instructions: "For live Web searches, use the server-side browser.search tool declared in the system message, and browser.open/browser.find to read results."
    # Use `provider: claude` and the `claude:` section for Claude Code.
    # claude:
    #   model: claude-sonnet-4-5
    #   permission_mode: bypassPermissions
    #   effort: high

  early_stopping:
    enabled: false   # set to false to disable keypoint-based early stopping

  trial:
    timeout_sec: 50000

  # code_edit: used by architecture_search application (write_files / run_tests stages)
  # code_edit:
  #   allowed_dirs: [src, tests]
  #   max_test_retries: 5
  #   reference_files:
  #     - /u/someki1/workspace/20_other_project/10_autoresearch_test/src/peft_model.py
  #   doc_urls:
  #     - https://masao-someki.github.io/espnet_draft_home_page/espnet3/guides/finetuning/custom-model.html

  search_space:
    allowed_keys:
      - trainer.*
      - optimizer.*
      - scheduler.*
      - model.specaug
      - model.specaug_conf.*
      - dataset.preprocessor.*
      - tokenizer.*
    denied_keys:
      - data.*
      - output_dir
      - collect_stats_dir
      - recipe_dir
      - exp_dir
      - stats_dir
      - inference_dir
