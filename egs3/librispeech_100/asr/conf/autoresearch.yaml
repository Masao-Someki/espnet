autoresearch:
  study_name: ls100_no_early_stop
  study_dir: exp/autoresearch/ls100_no_early_stop
  graph:
  application: hyperparameter_search
  objective_file: program.md

  task: ASR
  dataset: LibriSpeech 100h
  model: e_branchformer
  year: 2026

  recipe:
    training_config: conf/tuning/training_e_branchformer.yaml
    inference_config: conf/inference.yaml
    metrics_config: conf/metrics.yaml

  metric:
    name: dev_clean_wer
    mode: min
    extraction:
      - path: "inference/metrics.json"
        name: dev_clean_wer
        key: "espnet3.systems.asr.metrics.wer.WER.dev-clean.WER"
      - path: "exp/score_wer/result.txt"
        name: dev_clean_wer
        pattern: "WER: {value}"

  budget:
    max_trials: 200
    max_parallel_trials: 4
    max_failures: 10
    no_improve_stop: 10
    max_wallclock_hours: 24

  tick_interval_sec_idle: 60
  tick_interval_sec_trial_active: 600

  executor:
    controller:
      type: local
    trial:
      type: slurm
      resources:
        gpus: 1
        cpus: 16
        mem: 32G
        time: "12:00:00"
        partition: "gpuA100x4"
        account: bbjs-delta-gpu  # ← GPU アカウント
        reservation: sup-27103
        nodelist: gpua018

    tick:
      type: slurm
      resources:
        gpus: 0
        cpus: 1
        mem: 4G
        time: "06:00:00"
        partition: cpu
        account: bbjs-delta-cpu  # ← CPU アカウント

    trial_monitor:
      type: slurm
      resources:
        gpus: 0
        cpus: 1
        mem: 4G
        time: "01:00:00"
        partition: cpu
        account: bbjs-delta-cpu

  agent:
    type: python
    target: src.agent.UserDefinedCliAgent
    command:
      - codex
      - exec
      - -C
      - .
      - --skip-git-repo-check
      - --sandbox
      - workspace-write
      - --json
    output_flag: --output-last-message
    output_mode: last_message_file
    output_filename: agent_output.json
    prompt_arg: "-"
    env: {}

  search:
    type: noop

  search_queries:
    - "{dataset} ASR augmentation hyperparameter search"

  early_stopping:
    enabled: false   # set to false to disable keypoint-based early stopping

  trial:
    timeout_sec: 50000

  # code_edit: used by architecture_search application (write_files / run_tests stages)
  # code_edit:
  #   allowed_dirs: [src, tests]
  #   max_test_retries: 5
  #   reference_files:
  #     - /u/someki1/workspace/20_other_project/10_autoresearch_test/src/peft_model.py
  #   doc_urls:
  #     - https://masao-someki.github.io/espnet_draft_home_page/espnet3/guides/finetuning/custom-model.html

  search_space:
    allowed_keys:
      - trainer.*
      - optimizer.*
      - scheduler.*
      - model.specaug
      - model.specaug_conf.*
      - dataset.preprocessor.*
      - tokenizer.*
    denied_keys:
      - data.*
      - output_dir
      - collect_stats_dir
      - recipe_dir
      - exp_dir
      - stats_dir
      - inference_dir
