autoresearch:
  study_name: ls100_arch_search
  study_dir: exp/autoresearch/ls100_arch_search
  graph:
  application: architecture_search
  objective_file: program.md

  task: ASR
  dataset: LibriSpeech 100h
  model: e_branchformer
  year: 2026

  recipe:
    training_config: conf/tuning/training_e_branchformer.yaml
    inference_config: conf/inference.yaml
    metrics_config: conf/metrics.yaml

  metric:
    name: dev_clean_wer
    mode: min
    extraction:
      - path: "inference/metrics.json"
        name: dev_clean_wer
        key: "espnet3.systems.asr.metrics.wer.WER.dev-clean.WER"
      - path: "exp/score_wer/result.txt"
        name: dev_clean_wer
        pattern: "WER: {value}"

  budget:
    max_trials: 50
    max_parallel_trials: 2
    max_failures: 10
    no_improve_stop: 10
    max_wallclock_hours: 48

  tick_interval_sec_idle: 60
  tick_interval_sec_trial_active: 600

  executor:
    controller:
      type: local
    trial:
      type: slurm
      resources:
        gpus: 1
        cpus: 16
        mem: 32G
        time: "12:00:00"
        partition: "gpuA100x4"
        account: bbjs-delta-gpu
    tick:
      type: slurm
      resources:
        gpus: 0
        cpus: 1
        mem: 4G
        time: "06:00:00"
        partition: cpu
        account: bbjs-delta-cpu

  agent:
    type: python
    target: src.agent.UserDefinedCliAgent
    command:
      - codex
      - exec
      - -C
      - .
      - --skip-git-repo-check
      - --sandbox
      - workspace-write
      - --json
    output_flag: --output-last-message
    output_mode: last_message_file
    output_filename: agent_output.json
    prompt_arg: "-"
    env: {}

  search:
    type: noop

  search_queries:
    - "{dataset} ASR architecture search custom model"

  early_stopping:
    enabled: false

  trial:
    timeout_sec: 50000

  # code_edit: controls write_files and run_tests stages
  code_edit:
    # Directories the agent is allowed to create / modify (relative to recipe root)
    allowed_dirs:
      - src
      - tests
    # Max pytest fix-loops before giving up and routing to reflect
    max_test_retries: 5
    # Local files whose full content is injected into the write_files prompt as
    # reference for input format / model interface patterns
    reference_files:
      - /u/someki1/workspace/20_other_project/10_autoresearch_test/src/peft_model.py
    # URLs whose HTML is stripped and injected as documentation in the prompt.
    # Fetched once per study; cached under study_dir/.doc_cache/
    doc_urls:
      - https://masao-someki.github.io/espnet_draft_home_page/espnet3/guides/finetuning/custom-model.html

  search_space:
    # For architecture search the agent controls source files, but still uses
    # config_patch to wire _target_ and hyperparameters.
    allowed_keys:
      - model.*
      - trainer.*
      - optimizer.*
      - scheduler.*
    denied_keys:
      - data.*
      - output_dir
      - collect_stats_dir
      - recipe_dir
      - exp_dir
      - stats_dir
      - inference_dir
